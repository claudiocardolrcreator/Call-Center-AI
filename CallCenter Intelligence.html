<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: consola de supervisión — barra lateral azul noche, superficie de trabajo clara, cifras en monoespaciada.
   Color: azul oscuro (marca), blanco, verde (logro); rojo/ámbar solo como semántica. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f5; --line:#dfe4eb; --line-2:#c9d1dc;
  --fg:#0f1b2d; --fg-2:#46536a; --fg-3:#7a8699;
  --navy:#0d2240; --navy-fg:#e8eef7; --navy-2:#16305a;
  --green:#12a172; --green-soft:#e1f4ec; --red:#c7392f; --red-soft:#fbe8e6; --amber:#a76a00; --amber-soft:#fbf0d8;
  --blue:#2c5fb3; --blue-soft:#e6eefb;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(13,34,64,.06),0 6px 20px rgba(13,34,64,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --surface:#111a2b; --surface-2:#172338; --line:#22304a; --line-2:#2e3f5e;
  --fg:#e6ecf5; --fg-2:#a7b4c8; --fg-3:#76839a;
  --navy:#081120; --navy-fg:#dfe7f3; --navy-2:#13233f;
  --green:#34c995; --green-soft:#0f2c22; --red:#ff7b6f; --red-soft:#33181a; --amber:#f0b44c; --amber-soft:#2e2412;
  --blue:#7fa8f0; --blue-soft:#15243f; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#111a2b; --surface-2:#172338; --line:#22304a; --line-2:#2e3f5e;
  --fg:#e6ecf5; --fg-2:#a7b4c8; --fg-3:#76839a;
  --navy:#081120; --navy-fg:#dfe7f3; --navy-2:#13233f;
  --green:#34c995; --green-soft:#0f2c22; --red:#ff7b6f; --red-soft:#33181a; --amber:#f0b44c; --amber-soft:#2e2412;
  --blue:#7fa8f0; --blue-soft:#15243f; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:1.55rem;font-weight:600;letter-spacing:-.015em}
h2{font-size:.95rem;font-weight:600}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--fg-3);font-weight:600}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)} .small{font-size:.78rem}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100%}
.side{background:var(--navy);color:var(--navy-fg);position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:18px 12px;gap:2px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:2px 8px 18px}
.brand .mark{width:28px;height:28px;border-radius:7px;background:var(--green);display:grid;place-items:center;flex:none}
.brand b{font-weight:600;line-height:1.15;font-size:.92rem}
.brand span{display:block;font-size:.7rem;opacity:.65;font-weight:400}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--navy-fg);opacity:.78;text-decoration:none;font-weight:500}
.nav a:hover{background:var(--navy-2);opacity:1}
.nav a.on{background:var(--navy-2);opacity:1;box-shadow:inset 2px 0 0 var(--green)}
.nav a .badge{margin-left:auto;font-size:.65rem;font-family:var(--f-mono);background:var(--amber);color:var(--navy);border-radius:999px;padding:0 6px;font-weight:600}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--navy-2);font-size:.72rem;opacity:.75;display:grid;gap:8px}
.side-foot button{background:transparent;border:1px solid var(--navy-2);color:var(--navy-fg);border-radius:7px;padding:6px 8px;cursor:pointer;text-align:left}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top .grow{flex:1}
.content{padding-block:22px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));width:100%;max-width:1320px;margin:0 auto;display:grid;gap:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;font-size:.84rem;color:var(--fg);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--fg-3)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.primary{background:var(--green);border-color:var(--green);color:#06140f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--green);border-color:var(--green);color:#06140f}}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:4px 9px;font-size:.76rem}
.btn.danger{color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.input,select.input{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 9px;min-width:0;max-width:100%}
.field{display:grid;gap:3px}
.field label{font-size:.72rem;color:var(--fg-2);font-weight:500}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.filters .field{min-width:130px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-b{padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.page-h{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap}
.page-h p{margin-top:4px;max-width:70ch}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;display:grid;gap:6px;min-width:0}
.kpi .lab{font-size:.74rem;color:var(--fg-2);font-weight:500;display:flex;justify-content:space-between;gap:6px}
.kpi .v{font-family:var(--f-mono);font-size:1.4rem;font-weight:500;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .cmp{font-size:.72rem;color:var(--fg-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi.group-q{border-top:3px solid var(--blue)}
.kpi.group-p{border-top:3px solid var(--green)}
.delta{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-mono);font-size:.72rem;font-weight:500;padding:1px 6px;border-radius:999px}
.delta.good{background:var(--green-soft);color:var(--green)} .delta.bad{background:var(--red-soft);color:var(--red)} .delta.flat{background:var(--surface-2);color:var(--fg-2)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:500;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--fg-2);white-space:nowrap}
.chip.ok{background:var(--green-soft);color:var(--green);border-color:transparent}
.chip.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.err{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.info{background:var(--blue-soft);color:var(--blue);border-color:transparent}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;font-weight:600;color:var(--fg-3);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
th.sort{cursor:pointer;user-select:none} th.sort:hover{color:var(--fg)} th.on{color:var(--fg)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--surface-2)}
th.grp-p{box-shadow:inset 0 -2px 0 var(--green)} th.grp-q{box-shadow:inset 0 -2px 0 var(--blue)}

.drop{border:2px dashed var(--line-2);border-radius:14px;background:var(--surface);padding:34px 20px;display:grid;justify-items:center;gap:10px;text-align:center;transition:border-color .15s,background .15s;cursor:pointer}
.drop.over{border-color:var(--green);background:var(--green-soft)}
.drop svg{color:var(--fg-3)}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:.76rem}
.steps span{padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--fg-3)}
.steps span.on{background:var(--navy);color:#fff}
.steps span.done{background:var(--green-soft);color:var(--green)}

.bars{display:grid;gap:9px}
.barrow{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.8rem}
.barrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.track>span{display:block;height:100%;border-radius:5px;background:var(--green)}
.track.q>span{background:var(--blue)}
.track.low>span{background:var(--amber)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--fg-3);font-family:var(--f-mono);font-size:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--fg-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

.check{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check .sev{width:4px;border-radius:2px;align-self:stretch}
.check .sev.err{background:var(--red)} .check .sev.warn{background:var(--amber)} .check .sev.info{background:var(--blue)} .check .sev.ok{background:var(--green)}
.check details summary{cursor:pointer;color:var(--blue);font-size:.76rem;margin-top:4px}

.empty{padding:36px 18px;text-align:center;display:grid;gap:10px;justify-items:center;color:var(--fg-2)}
.empty b{color:var(--fg);font-size:1rem}
.modal-bg{position:fixed;inset:0;background:rgba(8,17,32,.5);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:14px;width:100%;max-width:860px;max-height:92vh;overflow:auto;display:grid;gap:14px;padding:20px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:.84rem;opacity:0;transition:all .2s;z-index:60;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.menu-btn{display:none}
.fade{animation:fade .22s ease}
@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:30;transform:translateX(-100%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .top .menu-btn{display:inline-flex}
  .top,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .barrow{grid-template-columns:minmax(0,110px) minmax(0,1fr) auto}
}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
</style>

<div class="app">

    <div class="brand"><span class="mark"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 12.5V9M6.5 12.5V5.5M10.5 12.5V7.5M14 12.5V3"/></svg></span><div><b>CallCenter Intelligence</b><span>Análisis de operarios</span></div></div>

      <button class="btn ghost" id="themeBtn" aria-label="Cambiar entre modo claro y oscuro"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg></button>

<script>
(function(){
"use strict";
/* ============ Almacenamiento local (solo en este navegador) ============ */
const LS={get(k,d){try{const v=localStorage.getItem("cci_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("cci_"+k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem("cci_"+k)}catch(e){}}};
let DB=LS.get("db",{records:[],imports:[],checks:[],currency:"S/"});
const UI={f:{year:"",month:"",team:"",sup:"",agent:""},rankBy:"sales",rankDir:-1,teamSup:"",cmpA:"",cmpB:"",convBase:LS.get("convBase","ans"),theme:LS.get("theme",null),pending:null};
if(UI.theme)document.documentElement.setAttribute("data-theme",UI.theme);
function persist(){if(!LS.set("db",DB))toast("No se pudo guardar en el navegador; los datos se perderán al cerrar la página")}

/* ============ Utilidades ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9%/]+/g," ").trim();
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const perLabel=p=>{if(!p)return"—";const[y,m]=p.split("-");return MESES[+m-1][0].toUpperCase()+MESES[+m-1].slice(1)+" "+y};
const prevPer=p=>{let[y,m]=p.split("-").map(Number);m--;if(!m){m=12;y--}return y+"-"+String(m).padStart(2,"0")};
const nf=(v,d=0)=>v==null||!isFinite(v)?"—":v.toLocaleString("es-PE",{minimumFractionDigits:d,maximumFractionDigits:d});
const pctf=(v,d=1)=>v==null||!isFinite(v)?"—":nf(v,d)+"%";
const money=v=>v==null||!isFinite(v)?"—":(DB.currency?DB.currency+" ":"")+nf(v,0);
const mmss=min=>{if(min==null||!isFinite(min))return"—";const s=Math.round(min*60);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600)}
const sum=(a,f)=>a.reduce((s,x)=>{const v=f(x);return v==null||!isFinite(v)?s:s+v},0);
const has=(a,k)=>a.some(r=>r[k]!=null);
function toNum(v){if(v==null||v==="")return null;if(typeof v==="number")return isFinite(v)?v:NaN;if(v instanceof Date)return NaN;
  let s=String(v).trim().replace(/[S\/$€\s]|soles/gi,"").replace(/%$/,"");if(s==="")return null;
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,"").replace(",",".");else if(/^-?\d+,\d+$/.test(s))s=s.replace(",",".");else s=s.replace(/,(?=\d{3}\b)/g,"");
  const n=Number(s);return isFinite(n)?n:NaN}
function toMinutes(v,unit){if(v==null||v==="")return null;
  if(v instanceof Date)return v.getUTCHours()*60+v.getUTCMinutes()+v.getUTCSeconds()/60;
  if(typeof v==="string"&&/^\d{1,2}:\d{2}(:\d{2})?$/.test(v.trim())){const p=v.trim().split(":").map(Number);return p.length===3?p[0]*60+p[1]+p[2]/60:p[0]+p[1]/60}
  const n=toNum(v);if(n==null||isNaN(n))return n;
  if(unit==="sec")return n/60;if(unit==="day")return n*1440;return n}
function toPeriod(v){if(v==null||v==="")return null;
  if(v instanceof Date&&!isNaN(v))return v.getUTCFullYear()+"-"+String(v.getUTCMonth()+1).padStart(2,"0");
  if(typeof v==="number"&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return toPeriod(d)}
  const s=norm(v);let m=s.match(/(20\d{2})[ /-](\d{1,2})\b/);if(m)return m[1]+"-"+m[2].padStart(2,"0");
  m=s.match(/\b(\d{1,2})[ /-](20\d{2})/);if(m&&+m[1]<=12)return m[2]+"-"+m[1].padStart(2,"0");
  m=s.match(/\b\d{1,2}[ /-](\d{1,2})[ /-](20\d{2})/);if(m)return m[2]+"-"+m[1].padStart(2,"0");
  const mi=MESES.findIndex(x=>s.includes(x)||s.includes(x.slice(0,3)+" ")||s.startsWith(x.slice(0,3)));let y=s.match(/20\d{2}/)||(s.match(/\b(\d{2})\b/)&&["20"+s.match(/\b(\d{2})\b/)[1]]);
  if(mi>=0&&y)return y[0]+"-"+String(mi+1).padStart(2,"0");return null}

/* ============ Diccionario de columnas ============ */
// Campo canónico → sinónimos (normalizados). El más largo que coincida gana.
const FIELDS=[
 ["agentId","ID del operario",["id operario","id agente","codigo operario","cod operario","id asesor","codigo","id empleado","usuario","id"],"text"],
 ["agent","Nombre del operario",["operario","nombre operario","agente","asesor","ejecutivo","colaborador","trabajador","empleado","operador","nombre"],"text"],
 ["team","Equipo",["equipo","campana","grupo","celula","area","linea"],"text"],
 ["sup","Supervisor",["supervisor","lider","jefe","coordinador","team leader"],"text"],
 ["period","Mes / fecha",["mes","periodo","fecha","month","mes reporte"],"period"],

const DERIVED=["cumplimiento","conversion","tasa"]; // columnas calculadas en el archivo: se recalculan
const FMAP=Object.fromEntries(FIELDS.map(f=>[f[0],f]));
function autoMap(headers){
  const used=new Set(),map={};
  const cands=[];
  headers.forEach((h,ci)=>{const n=norm(h).replace(/ %$/,"").replace(/ s\/$/,"").replace(/ min$/,"").trim();if(!n)return;
    if(DERIVED.some(d=>n.startsWith(d)))return;
    FIELDS.forEach(([k,,syn])=>syn.forEach(s=>{let score=0;if(n===s)score=1000+s.length;else if((" "+n+" ").includes(" "+s+" "))score=s.length;if(score)cands.push({k,ci,score})}))});
  cands.sort((a,b)=>b.score-a.score);
  for(const c of cands){if(map[c.k]!=null||used.has(c.ci))continue;map[c.k]=c.ci;used.add(c.ci)}
  return map;
}

/* ============ Lectura de libros ============ */
function sheetTable(ws){
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true,blankrows:false});
  let hi=0;for(let i=0;i<Math.min(12,rows.length);i++){const r=rows[i]||[];if(r.filter(c=>typeof c==="string"&&c.trim()).length>=3){hi=i;break}}
  const headers=(rows[hi]||[]).map((h,i)=>h==null||h===""?"Columna "+(i+1):String(h).trim());
  const data=rows.slice(hi+1).filter(r=>r&&r.some(c=>c!=null&&c!==""));
  return{headers,data,headerRow:hi+1};
}
function classify(t){
  const H=t.headers.map(norm);const hasH=re=>H.some(h=>re.test(h));
  if(t.headers.length<=3&&hasH(/^campo$/)&&hasH(/descripcion/))return"ignore";
  if(hasH(/estado/)&&hasH(/importe|monto|precio|valor/)&&hasH(/venta/))return"salesDetail";
  const m=autoMap(t.headers);
  const metrics=["calls","ans","sales","goal","revenue","aht","quality","adherence"].filter(k=>m[k]!=null).length;
  if((m.agent!=null||m.agentId!=null)&&metrics>=2)return m.period!=null&&new Set(t.data.map(r=>r[m.agentId??m.agent])).size<t.data.length?"activity":"summary";
  return"ignore";
}
function inferPeriods(wb,tables){
  const found={};
  tables.forEach(t=>{t.headers.forEach((h,ci)=>{if(/fecha|mes|periodo/.test(norm(h)))t.data.forEach(r=>{const p=toPeriod(r[ci]);if(p)found[p]=(found[p]||0)+1})})});
  return Object.entries(found).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}
async function readFiles(files){
  const out=[];
  for(const file of files){
    const ext=file.name.split(".").pop().toLowerCase();
    if(!["xlsx","xls","csv"].includes(ext)){out.push({name:file.name,error:"Formato no admitido. Usa .xlsx, .xls o .csv."});continue}
    if(file.size>25*1024*1024){out.push({name:file.name,error:"El archivo supera 25 MB."});continue}
    try{
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:"array",cellDates:true});
      const tables=wb.SheetNames.map(n=>({name:n,...sheetTable(wb.Sheets[n])}));
      tables.forEach(t=>t.role=classify(t));
      // Si no hay hoja resumen, la de actividad diaria hace de principal (se agrega por mes)
      if(!tables.some(t=>t.role==="summary")){const a=tables.find(t=>t.role==="activity");if(a)a.role="summary"}
      else{let first=true;tables.forEach(t=>{if(t.role==="summary"){if(!first)t.role="ignore";first=false}})}
      const main=tables.find(t=>t.role==="summary");
      const periods=inferPeriods(wb,tables);
      const fromName=toPeriod(file.name.replace(/[_.]/g," "));
      out.push({name:file.name,size:file.size,tables,mainIdx:main?tables.indexOf(main):0,map:main?autoMap(main.headers):{},
        period:periods[0]||fromName||"",periodHint:periods.length?"Detectado en las fechas del archivo":fromName?"Detectado en el nombre del archivo":"",ahtUnit:"auto"});
    }catch(e){out.push({name:file.name,error:"No se pudo leer el archivo. ¿Está protegido con contraseña o dañado?"})}
  }
  return out;
}

/* ============ Normalización + validación ============ */
function detectAhtUnit(header,vals){const h=norm(header);if(/seg|sec|\bs\b/.test(h))return"sec";if(/min/.test(h))return"min";
  const nums=vals.filter(v=>typeof v==="number");if(nums.length&&nums.every(v=>v<1))return"day";const med=nums.sort((a,b)=>a-b)[Math.floor(nums.length/2)];return med>30?"sec":"min"}
function buildFile(F){
  const t=F.tables[F.mainIdx],m=F.map,issues=[],rows=[];
  const col=k=>m[k]==null?null:m[k];
  const unit=F.ahtUnit!=="auto"?F.ahtUnit:(col("aht")!=null?detectAhtUnit(t.headers[col("aht")],t.data.map(r=>r[col("aht")])):"min");
  const pctScale={};["quality","adherence"].forEach(k=>{if(col(k)==null)return;const v=t.data.map(r=>toNum(r[col(k)])).filter(x=>x!=null&&!isNaN(x));pctScale[k]=v.length&&v.every(x=>x<=1)?100:1});
  const add=(lvl,msg,row)=>issues.push({lvl,msg,row});
  if(col("agent")==null&&col("agentId")==null)add("err","Falta la columna del operario (nombre o ID). Asígnala en el mapeo.");
  if(col("period")==null&&!F.period)add("err","Indica a qué mes corresponden los datos.");
  t.data.forEach((r,i)=>{
    const rn=i+t.headerRow+1, g=k=>col(k)==null?null:r[col(k)];
    const rec={row:rn};
    rec.agentId=g("agentId")!=null?String(g("agentId")).trim():null;
    rec.agent=g("agent")!=null?String(g("agent")).trim():(rec.agentId);
    if(!rec.agent&&!rec.agentId){add("warn","Fila sin operario: se omite",rn);return}
    rec.team=g("team")!=null?String(g("team")).trim():"Sin equipo";
    rec.sup=g("sup")!=null?String(g("sup")).trim():"Sin supervisor";
    rec.period=col("period")!=null?toPeriod(g("period")):F.period;
    if(!rec.period){add("err",`Fecha o mes no reconocido: “${esc(g("period"))}”`,rn);return}
    for(const k of ["calls","ans","sales","salesVal","goal","revenue","absences"]){const v=toNum(g(k));if(Number.isNaN(v)){add("warn",`${FMAP[k][1]}: “${esc(g(k))}” no es un número; se deja vacío`,rn);rec[k]=null}else rec[k]=v;if(rec[k]!=null&&rec[k]<0){add("warn",`${FMAP[k][1]} negativo (${rec[k]})`,rn)}}
    const a=toMinutes(g("aht"),unit);rec.aht=Number.isNaN(a)?null:a;if(Number.isNaN(a))add("warn",`Tiempo de atención “${esc(g("aht"))}” no reconocido`,rn);
    for(const k of ["quality","adherence"]){const v=toNum(g(k));rec[k]=v==null||Number.isNaN(v)?null:v*(pctScale[k]||1);if(Number.isNaN(v))add("warn",`${FMAP[k][1]}: “${esc(g(k))}” no es un número`,rn);if(rec[k]!=null&&rec[k]>100)add("warn",`${FMAP[k][1]} mayor que 100 (${rec[k]})`,rn)}
    if(rec.calls!=null&&rec.ans!=null&&rec.ans>rec.calls)add("warn",`Contestadas (${rec.ans}) mayores que realizadas (${rec.calls})`,rn);
    if(rec.ans!=null&&rec.sales!=null&&rec.sales>rec.ans)add("warn",`Ventas (${rec.sales}) mayores que llamadas contestadas (${rec.ans})`,rn);
    ["calls","ans","sales","goal","revenue","aht","quality","adherence"].forEach(k=>{if(col(k)!=null&&rec[k]==null&&(g(k)==null||g(k)===""))add("info",`${FMAP[k][1]} vacío`,rn)});
    rec.key=(rec.agentId||norm(rec.agent));
    rows.push(rec);
  });
  // duplicados exactos y agregación por operario+mes
  const seen=new Map(),agg=new Map();let dupExact=0,merged=0;
  rows.forEach(r=>{const sig=JSON.stringify({...r,row:0});if(seen.has(sig)){dupExact++;add("warn",`Fila duplicada idéntica a la fila ${seen.get(sig)}: se excluye`,r.row);return}seen.set(sig,r.row);
    const k=r.key+"|"+r.period;if(!agg.has(k)){agg.set(k,{...r,_n:1,_ahtW:r.aht!=null&&r.ans!=null?r.aht*r.ans:null,_q:[r.quality],_a:[r.adherence]})}else{merged++;const x=agg.get(k);x._n++;
      ["calls","ans","sales","salesVal","goal","revenue","absences"].forEach(f=>{if(r[f]!=null)x[f]=(x[f]||0)+r[f]});
      if(r.aht!=null&&r.ans!=null)x._ahtW=(x._ahtW||0)+r.aht*r.ans;x._q.push(r.quality);x._a.push(r.adherence)}});
  const records=[...agg.values()].map(x=>{const r={...x};if(x._n>1){if(x._ahtW!=null&&x.ans)r.aht=x._ahtW/x.ans;const q=x._q.filter(v=>v!=null),a=x._a.filter(v=>v!=null);r.quality=q.length?q.reduce((s,v)=>s+v,0)/q.length:null;r.adherence=a.length?a.reduce((s,v)=>s+v,0)/a.length:null}
    delete r._n;delete r._ahtW;delete r._q;delete r._a;delete r.row;r.src=F.name;return r});
  if(merged)add("info",`${merged} filas se sumaron por operario y mes (datos diarios o repetidos con valores distintos).`);
  // Hojas secundarias: detalle de ventas y actividad diaria → controles cruzados
  const extra=crossChecks(F,records);
  return{records,issues,unit,pctScale,extra,dupExact};
}
function findCol(headers,res){const H=headers.map(norm);for(const re of res){const i=H.findIndex(h=>re.test(h));if(i>=0)return i}return null}
function crossChecks(F,records){
  const checks=[],byKey=new Map(records.map(r=>[r.key+"|"+r.period,r]));
  const nameToKey=new Map(records.map(r=>[norm(r.agent),r.key]));
  F.tables.forEach((t,ti)=>{
    if(ti===F.mainIdx)return;
    if(t.role==="salesDetail"){
      const ci={id:findCol(t.headers,[/^id operario$/,/id (agente|asesor|operario)/,/codigo/]),name:findCol(t.headers,[/^operario$/,/agente|asesor|nombre/]),st:findCol(t.headers,[/^estado$/,/estado/]),amt:findCol(t.headers,[/importe|monto|precio|valor/]),date:findCol(t.headers,[/fecha/,/mes|periodo/])};
      if(ci.st==null||(ci.id==null&&ci.name==null)){checks.push({lvl:"info",title:`Hoja “${t.name}”: no se pudo relacionar con los operarios`,detail:"Faltan columnas de estado u operario."});return}
      const agg=new Map();let unk=0;
      t.data.forEach(r=>{const key=ci.id!=null&&r[ci.id]!=null?String(r[ci.id]).trim():nameToKey.get(norm(r[ci.name]));const per=ci.date!=null?toPeriod(r[ci.date]):F.period;if(!key||!byKey.has(key+"|"+per)){unk++;return}
        const st=norm(r[ci.st]),amt=ci.amt!=null?toNum(r[ci.amt])||0:0,x=agg.get(key+"|"+per)||{tot:0,val:0,pen:0,anu:0,amt:0,amtVal:0};
        x.tot++;x.amt+=amt;if(/valid|aprob|confirm|activ/.test(st)){x.val++;x.amtVal+=amt}else if(/anul|cancel|rechaz|baja/.test(st))x.anu++;else x.pen++;agg.set(key+"|"+per,x)});
      let difSales=[],difRev=[];
      agg.forEach((x,k)=>{const r=byKey.get(k);r.salesVal=x.val;r.salesPend=x.pen;r.salesAnul=x.anu;r.revVal=+x.amtVal.toFixed(2);r.revDetail=+x.amt.toFixed(2);
        if(r.sales!=null&&r.sales!==x.tot)difSales.push(`${r.agent}: resumen ${nf(r.sales)} · detalle ${nf(x.tot)}`);
        if(r.revenue!=null&&Math.abs(r.revenue-x.amt)>0.5)difRev.push(`${r.agent}: resumen ${money(r.revenue)} · suma del detalle ${money(x.amt)}`)});
      const T=[...agg.values()].reduce((s,x)=>({tot:s.tot+x.tot,val:s.val+x.val,pen:s.pen+x.pen,anu:s.anu+x.anu}),{tot:0,val:0,pen:0,anu:0});
      checks.push({lvl:"info",title:`Detalle de ventas leído: ${nf(T.tot)} ventas (${nf(T.val)} validadas, ${nf(T.pen)} pendientes, ${nf(T.anu)} anuladas)`,detail:`Hoja “${t.name}”. Las ventas validadas y sus importes se muestran aparte de las registradas.`});
      if(difSales.length)checks.push({lvl:"warn",title:`${difSales.length} operarios con ventas distintas entre el resumen y el detalle`,detail:"Se usa la cifra del resumen como ventas registradas.",list:difSales});
      else checks.push({lvl:"ok",title:"Las ventas del resumen coinciden con el número de ventas del detalle",detail:`Comprobado en ${agg.size} operarios.`});
      if(difRev.length)checks.push({lvl:"warn",title:`${difRev.length} operarios con ingresos del resumen distintos a la suma de importes del detalle`,detail:"Se muestran los ingresos del resumen como “Ingresos” y los del detalle validado como “Ingresos validados”. Conviene revisar cuál es la fuente oficial.",list:difRev});
      if(unk)checks.push({lvl:"warn",title:`${unk} ventas del detalle no se pudieron asociar a un operario del resumen`,detail:`Hoja “${t.name}”.`});
    }
    if(t.role==="activity"){
      const m=autoMap(t.headers);const ci={id:m.agentId,name:m.agent,date:m.period,calls:m.calls,ans:m.ans,sales:m.sales};
      const minCol=findCol(t.headers,[/minutos en llamada|minutos|tiempo en llamada|talk/]);
      if((ci.id==null&&ci.name==null)||ci.date==null)return;
      const agg=new Map();
      t.data.forEach(r=>{const key=ci.id!=null&&r[ci.id]!=null?String(r[ci.id]).trim():nameToKey.get(norm(r[ci.name]));const per=toPeriod(r[ci.date]);if(!key||!per)return;
        const x=agg.get(key+"|"+per)||{calls:0,ans:0,sales:0,min:0,days:0};x.days++;x.calls+=toNum(r[ci.calls])||0;x.ans+=toNum(r[ci.ans])||0;x.sales+=toNum(r[ci.sales])||0;if(minCol!=null)x.min+=toNum(r[minCol])||0;agg.set(key+"|"+per,x)});
      const dif={calls:[],ans:[],sales:[],aht:[]};
      agg.forEach((x,k)=>{const r=byKey.get(k);if(!r)return;r.days=x.days;
        if(ci.calls!=null&&r.calls!=null&&r.calls!==x.calls)dif.calls.push(`${r.agent}: resumen ${nf(r.calls)} · diario ${nf(x.calls)}`);
        if(ci.ans!=null&&r.ans!=null&&r.ans!==x.ans)dif.ans.push(`${r.agent}: resumen ${nf(r.ans)} · diario ${nf(x.ans)}`);
        if(ci.sales!=null&&r.sales!=null&&r.sales!==x.sales)dif.sales.push(`${r.agent}: resumen ${nf(r.sales)} · diario ${nf(x.sales)}`);
        if(minCol!=null&&x.ans&&r.aht!=null&&Math.abs(r.aht-x.min/x.ans)>0.1)dif.aht.push(`${r.agent}: resumen ${mmss(r.aht)} · diario ${mmss(x.min/x.ans)}`)});
      const lab={calls:"llamadas realizadas",ans:"llamadas contestadas",sales:"ventas",aht:"tiempo promedio de atención"};
      const bad=Object.entries(dif).filter(([,v])=>v.length);

/* ============ Motor de KPI ============ */
function kpis(R){
  if(!R.length)return null;
  const wGoal=R.filter(r=>r.goal!=null&&r.sales!=null),wAns=R.filter(r=>r.ans!=null&&r.sales!=null),wCalls=R.filter(r=>r.calls!=null&&r.sales!=null),wAht=R.filter(r=>r.aht!=null&&r.ans!=null&&r.ans>0);
  const q=R.filter(r=>r.quality!=null),a=R.filter(r=>r.adherence!=null);
  const convBase=UI.convBase==="calls"?wCalls:wAns, convDen=UI.convBase==="calls"?sum(wCalls,r=>r.calls):sum(wAns,r=>r.ans);
  return{
    ops:new Set(R.map(r=>r.key)).size,
    calls:has(R,"calls")?sum(R,r=>r.calls):null, ans:has(R,"ans")?sum(R,r=>r.ans):null,
    sales:has(R,"sales")?sum(R,r=>r.sales):null, salesVal:has(R,"salesVal")?sum(R,r=>r.salesVal):null,
    revenue:has(R,"revenue")?sum(R,r=>r.revenue):null, revVal:has(R,"revVal")?sum(R,r=>r.revVal):null,
    goal:wGoal.length?sum(wGoal,r=>r.goal):null,
    goalPct:wGoal.length&&sum(wGoal,r=>r.goal)?sum(wGoal,r=>r.sales)/sum(wGoal,r=>r.goal)*100:null,
    reached:wGoal.length?wGoal.filter(r=>r.goal&&r.sales>=r.goal).length/wGoal.length*100:null,
    conv:convBase.length&&convDen?sum(convBase,r=>r.sales)/convDen*100:null,
    contact:R.some(r=>r.calls)&&has(R,"ans")?sum(R.filter(r=>r.calls!=null&&r.ans!=null),r=>r.ans)/sum(R.filter(r=>r.calls!=null&&r.ans!=null),r=>r.calls)*100:null,
    aht:wAht.length?sum(wAht,r=>r.aht*r.ans)/sum(wAht,r=>r.ans):(has(R,"aht")?sum(R,r=>r.aht)/R.filter(r=>r.aht!=null).length:null),
    quality:q.length?sum(q,r=>r.quality)/q.length:null,
    adherence:a.length?sum(a,r=>r.adherence)/a.length:null,
    salesPerOp:has(R,"sales")?sum(R,r=>r.sales)/new Set(R.map(r=>r.key)).size:null,
  };
}
function agentRow(r){return{...r,goalPct:r.goal?r.sales/r.goal*100:null,conv:UI.convBase==="calls"?(r.calls?r.sales/r.calls*100:null):(r.ans?r.sales/r.ans*100:null),valRate:r.salesVal!=null&&r.sales?r.salesVal/r.sales*100:null}}
// dirección: 1 = más es mejor, -1 = menos es mejor

 ["ops","Operarios",v=>nf(v),0,"n","p"],["calls","Llamadas realizadas",v=>nf(v),0,"n","p"],["ans","Llamadas contestadas",v=>nf(v),1,"n","p"],

function deltaHTML(cur,prev,dir,kind){
  if(cur==null||prev==null)return null;
  const d=cur-prev;const good=dir===0?null:(d*dir>0);const cls=Math.abs(d)<1e-9||dir===0?"flat":good?"good":"bad";const arrow=d>0?"▲":d<0?"▼":"■";
  if(kind==="pp")return `<span class="delta ${cls}">${arrow} ${nf(Math.abs(d),1)} pp</span>`;
  const p=prev?d/prev*100:null;
  return `<span class="delta ${cls}">${arrow} ${p==null?"—":nf(Math.abs(p),1)+"%"}</span>`;
}

const RANK=[["sales","Ventas",1,v=>nf(v),"p"],["goalPct","Cumplimiento",1,v=>pctf(v),"p"],["conv","Conversión",1,v=>pctf(v,2),"p"],["revenue","Ingresos",1,v=>money(v),"p"],["quality","Calidad",1,v=>pctf(v),"q"],["adherence","Adherencia",1,v=>pctf(v),"q"],["aht","Menor TMO",-1,v=>mmss(v),"q"]];

   <div class="filters"><div class="field"><label for="rankBy">Ordenar ranking por</label><select class="input" id="rankBy">${RANK.map(([kk,l,,,g])=>`<option value="${kk}" ${kk===k?"selected":""}>${g==="p"?"Productividad · ":"Calidad · "}${kk==="aht"?"Menor tiempo de atención":"Mayor "+l.toLowerCase()}</option>`).join("")}</select></div></div></div></section>

  <div class="grid g2">
   <section class="panel"><div class="panel-h"><h2>Top 10 · ${def[1]}</h2><span class="chip ok">Destacados</span></div><div class="panel-b">${hbars(top.map(r=>({label:r.agent,value:r[k],click:r.key,cls:def[4]==="q"?"q":""})),{fmt:def[3],max:def[2]===-1?max:undefined})}</div></section>
   <section class="panel"><div class="panel-h"><h2>10 que necesitan apoyo · ${def[1]}</h2><span class="chip warn">Revisar contexto</span></div><div class="panel-b">${hbars(bottom.map(r=>({label:r.agent,value:r[k],click:r.key,cls:"low"})),{fmt:def[3],max})}</div></section>
  </div>`}
  <section class="panel"><div class="panel-h"><h2>Todos los operarios (${rows.length})</h2><button class="btn sm" data-copy="rankTbl">Copiar tabla para Excel</button></div>
   <div class="tbl-wrap"><table id="rankTbl"><thead><tr><th>#</th><th>Operario</th><th>Equipo</th><th>Supervisor</th>
   ${[["sales","Ventas","p"],["goal","Meta","p"],["goalPct","Cumpl.","p"],["conv","Conv.","p"],["revenue","Ingresos","p"],["quality","Calidad","q"],["adherence","Adher.","q"],["aht","TMO","q"]].map(([kk,l,g])=>`<th class="n grp-${g} ${RANK.some(x=>x[0]===kk)?"sort":""} ${kk===k?"on":""}" ${RANK.some(x=>x[0]===kk)?`data-sort="${kk}"`:""}>${l}${kk===k?(def[2]===-1?" ↑":" ↓"):""}</th>`).join("")}</tr></thead><tbody>
   ${tbl.map((r,i)=>`<tr class="click" data-agent="${esc(r.key)}"><td class="num faint">${r[k]!=null?i+1:"—"}</td><td><b style="font-weight:500">${esc(r.agent)}</b>${r.agentId&&r.agentId!==r.agent?` <span class="faint small">${esc(r.agentId)}</span>`:""}</td><td>${esc(r.team)}</td><td>${esc(r.sup)}</td><td class="n">${nf(r.sales)}</td><td class="n">${nf(r.goal)}</td><td class="n" style="color:${r.goalPct==null?"":r.goalPct>=100?"var(--green)":r.goalPct<80?"var(--amber)":""}">${pctf(r.goalPct)}</td><td class="n">${pctf(r.conv,2)}</td><td class="n">${money(r.revenue)}</td><td class="n">${pctf(r.quality)}</td><td class="n">${pctf(r.adherence)}</td><td class="n">${mmss(r.aht)}</td></tr>`).join("")}
   </tbody></table></div></section>`;
};

V.comparar=function(){
  const P=periods();
  if(P.length<2)return `<div class="page-h"><div><span class="eyebrow">Comparar meses</span><h1>Comparación entre meses</h1></div></div><section class="panel empty"><b>Hace falta al menos un segundo mes</b><span>Solo hay datos de ${P.map(perLabel).join(", ")}. Importa el Excel de otro mes para comparar. No se generan comparaciones con meses sin datos.</span><a class="btn primary" href="#importar">Importar otro mes</a></section>`;
  const A=UI.cmpA&&P.includes(UI.cmpA)?UI.cmpA:P[P.length-2],B=UI.cmpB&&P.includes(UI.cmpB)?UI.cmpB:P[P.length-1];
  const RA=applyF(DB.records.filter(r=>r.period===A),{noAgent:true}),RB=applyF(DB.records.filter(r=>r.period===B),{noAgent:true});
  const KA=kpis(RA),KB=kpis(RB);
  const rowsK=[...KDEF,["salesVal","Ventas validadas",v=>nf(v),1,"n","p"],["salesPerOp","Ventas por operario (productividad)",v=>nf(v,1),1,"n","p"]];
  const mA=new Map(RA.map(r=>[r.key,agentRow(r)])),both=RB.map(agentRow).filter(r=>mA.has(r.key)).map(r=>({r,a:mA.get(r.key),d:(r.sales??0)-(mA.get(r.key).sales??0),dq:r.quality!=null&&mA.get(r.key).quality!=null?r.quality-mA.get(r.key).quality:null}));
  const better=both.filter(x=>x.d>0).sort((a,b)=>b.d-a.d),worse=both.filter(x=>x.d<0).sort((a,b)=>a.d-b.d);
  const onlyA=RA.filter(r=>!RB.some(x=>x.key===r.key)),onlyB=RB.filter(r=>!RA.some(x=>x.key===r.key));
  const sel=(id,v)=>`<select class="input" id="${id}">${P.map(p=>`<option value="${p}" ${p===v?"selected":""}>${perLabel(p)}</option>`).join("")}</select>`;
  const fmtD=(a,b,f,kind)=>{if(a==null||b==null)return["—","—"];const d=b-a;if(kind==="pp")return[(d>0?"+":"")+nf(d,1)+" pp","—"];return[(d>0?"+":d<0?"−":"")+f(Math.abs(d)).replace(/^—$/,"0"),a?(d>0?"+":"")+nf(d/a*100,1)+"%":"—"]};
  const evo=P.map(p=>kpis(applyF(DB.records.filter(r=>r.period===p),{noAgent:true})));
  return `<div class="page-h"><div><span class="eyebrow">Comparar meses</span><h1>${perLabel(A)} vs. ${perLabel(B)}</h1><p class="muted">Variaciones absolutas y porcentuales. Para indicadores que ya son porcentajes se usa la diferencia en puntos porcentuales (pp).</p></div>
   <div class="filters"><div class="field"><label for="cmpA">Mes base</label>${sel("cmpA",A)}</div><div class="field"><label for="cmpB">Mes a comparar</label>${sel("cmpB",B)}</div></div></div>
  <section class="panel"><div class="panel-b">${filtersHTML(false).replace(/<div class="field"><label for="fy">[\s\S]*?<\/select><\/div>\s*<div class="field"><label for="fm">[\s\S]*?<\/select><\/div>/,"")}</div></section>
  <section class="panel"><div class="panel-h"><h2>Indicadores</h2><button class="btn sm" data-copy="cmpTbl">Copiar tabla para Excel</button></div><div class="tbl-wrap"><table id="cmpTbl"><thead><tr><th>Indicador</th><th class="n">${perLabel(A)}</th><th class="n">${perLabel(B)}</th><th class="n">Variación</th><th class="n">Variación %</th><th></th></tr></thead><tbody>
   ${rowsK.map(([k,l,f,dir,kind])=>{const a=KA?KA[k]:null,b=KB?KB[k]:null;const[d,p]=fmtD(a,b,f,kind);return `<tr><td>${l}</td><td class="n">${f(a)}</td><td class="n">${f(b)}</td><td class="n">${d}</td><td class="n">${p}</td><td>${deltaHTML(b,a,dir,kind)||'<span class="faint small">sin dato</span>'}</td></tr>`}).join("")}
  </tbody></table></div></section>
  <div class="grid g2">
   <section class="panel"><div class="panel-h"><h2>Mejoraron en ventas</h2><span class="chip ok">${better.length}</span></div><div class="panel-b">${better.length?hbars(better.slice(0,12).map(x=>({label:x.r.agent,value:x.d,click:x.r.key})),{fmt:v=>"+"+nf(v)}):'<p class="muted small">Nadie aumentó sus ventas.</p>'}</div></section>
   <section class="panel"><div class="panel-h"><h2>Empeoraron en ventas</h2><span class="chip warn">${worse.length}</span></div><div class="panel-b">${worse.length?hbars(worse.slice(0,12).map(x=>({label:x.r.agent,value:-x.d,click:x.r.key,cls:"low"})),{fmt:v=>"−"+nf(v)}):'<p class="muted small">Nadie redujo sus ventas.</p>'}</div></section>
  </div>
  ${onlyA.length||onlyB.length?`<section class="panel"><div class="panel-b small muted">${onlyA.length?`Solo en ${perLabel(A)}: ${onlyA.map(r=>esc(r.agent)).join(", ")}. `:""}${onlyB.length?`Solo en ${perLabel(B)}: ${onlyB.map(r=>esc(r.agent)).join(", ")}.`:""} Estos operarios no se incluyen en mejoras ni empeoramientos.</div></section>`:""}
  <section class="panel"><div class="panel-h"><h2>Evolución de todos los meses importados</h2><div class="legend"><span><i style="background:var(--green)"></i>Cumplimiento %</span><span><i style="background:var(--blue)"></i>Calidad %</span></div></div><div class="panel-b">${lineChart([{data:evo.map(k=>k&&k.goalPct),color:"var(--green)"},{data:evo.map(k=>k&&k.quality),color:"var(--blue)"}],P.map(shortPer),{fmt:v=>nf(v,0),yMin0:false})}</div></section>`;
};

/* ============ Vista: Revisión de datos ============ */
function checkHTML(c){return `<div class="check"><span class="sev ${c.lvl}"></span><div><b style="font-weight:500">${esc(c.title)}</b><p class="muted small">${esc(c.detail||"")}${c.file?` · Archivo: ${esc(c.file)}`:""}</p>${c.list&&c.list.length?`<details><summary>Ver ${c.list.length} casos</summary><ul class="small muted" style="margin:6px 0 0;padding-left:18px">${c.list.slice(0,100).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>`:""}</div></div>`}
V.revision=function(){
  const cp=curPeriod(),R=DB.records.filter(r=>r.period===cp);
  const gaps=[];const reqs=[["calls","llamadas realizadas"],["ans","llamadas contestadas"],["sales","ventas"],["goal","meta"],["quality","calidad"],["adherence","adherencia"],["aht","tiempo de atención"]];
  reqs.forEach(([k,l])=>{const miss=R.filter(r=>r[k]==null);if(miss.length&&miss.length<R.length)gaps.push({lvl:"warn",title:`${miss.length} operarios sin dato de ${l} en ${perLabel(cp)}`,list:miss.map(r=>r.agent)});if(miss.length===R.length)gaps.push({lvl:"info",title:`El archivo de ${perLabel(cp)} no trae ${l}`,detail:"Los indicadores que dependen de este dato se muestran como “—”."})});
  const val=R.filter(r=>r.salesVal!=null&&r.sales);const lowVal=val.filter(r=>r.salesVal/r.sales<0.85);
  if(val.length)gaps.push({lvl:lowVal.length?"warn":"ok",title:lowVal.length?`${lowVal.length} operarios con menos del 85% de sus ventas validadas`:"Todas las ventas registradas tienen una tasa de validación de al menos 85%",detail:"Diferencia entre ventas registradas y validadas (pendientes + anuladas). Puede deberse a ventas aún en proceso; no implica por sí sola un problema del operario.",list:lowVal.map(r=>`${r.agent}: ${r.salesVal} de ${r.sales} validadas (${nf(r.salesVal/r.sales*100,1)}%) · ${r.salesPend||0} pendientes · ${r.salesAnul||0} anuladas`)});
  const C=DB.checks.filter(c=>!c.periods||c.periods.includes(cp));
  return `<div class="page-h"><div><span class="eyebrow">Revisión de datos · ${perLabel(cp)}</span><h1>Calidad de los datos importados</h1><p class="muted">Controles automáticos sobre lo importado. Cada aviso indica qué datos lo respaldan.</p></div>
   <div class="filters"><div class="field"><label for="fy">Año</label>${filtersHTML(false).match(/<select class="input" id="fy">[\s\S]*?<\/select>/)[0]}</div><div class="field"><label for="fm">Mes</label>${filtersHTML(false).match(/<select class="input" id="fm">[\s\S]*?<\/select>/)[0]}</div></div></div>
  <section class="panel"><div class="panel-h"><h2>Controles entre hojas del archivo</h2></div>${C.length?C.map(checkHTML).join(""):'<div class="empty">No había otras hojas para contrastar.</div>'}</section>
  <section class="panel"><div class="panel-h"><h2>Datos incompletos y ventas validadas</h2></div>${gaps.length?gaps.map(checkHTML).join(""):'<div class="empty">Sin campos vacíos en los datos usados.</div>'}</section>
  <section class="panel"><div class="panel-h"><h2>Datos guardados en este navegador</h2></div><div class="panel-b" style="display:grid;gap:12px">
   <p class="small muted">${DB.records.length} registros de ${periods().map(perLabel).join(", ")}. Se guardan solo en este navegador y no se envían a ningún servidor.</p>
   <div style="display:flex;gap:8px;flex-wrap:wrap">${periods().map(p=>`<button class="btn sm" data-delper="${p}">Eliminar ${perLabel(p)}</button>`).join("")}<button class="btn sm danger" id="delAll">Eliminar todos los datos</button></div>
   <div id="confirmBox"></div></div></section>`;
};
V.revision.after=function(){
  const ask=(msg,fn)=>{$("#confirmBox").innerHTML=`<div class="panel" style="padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-color:var(--red)"><span class="small">${msg}</span><button class="btn sm danger" id="yes">Sí, eliminar</button><button class="btn sm" id="no">Cancelar</button></div>`;$("#yes").onclick=fn;$("#no").onclick=()=>$("#confirmBox").innerHTML=""};
  $$("[data-delper]").forEach(b=>b.onclick=()=>ask(`¿Eliminar todos los registros de ${perLabel(b.dataset.delper)}? No se puede deshacer.`,()=>{const p=b.dataset.delper;DB.records=DB.records.filter(r=>r.period!==p);DB.checks=DB.checks.filter(c=>!(c.periods&&c.periods.length===1&&c.periods[0]===p));persist();UI.f.month="";toast(`Datos de ${perLabel(p)} eliminados`);render()}));
  $("#delAll").onclick=()=>ask("¿Eliminar todos los datos importados de este navegador? No se puede deshacer.",()=>{DB={records:[],imports:[],checks:[],currency:"S/"};LS.del("db");toast("Datos eliminados");location.hash="importar";render()});
};

/* ============ Ficha individual ============ */
function agentModal(key){
  const hist=DB.records.filter(r=>r.key===key).sort((a,b)=>a.period.localeCompare(b.period)).map(agentRow);if(!hist.length)return;
  const cp=curPeriod();const r=hist.find(h=>h.period===cp)||hist[hist.length-1];
  const team=DB.records.filter(x=>x.period===r.period&&x.team===r.team).map(agentRow);
  const avg=k=>{const v=team.map(x=>x[k]).filter(x=>x!=null);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};
  const rows=[["Ventas registradas","sales",v=>nf(v),1],["Ventas validadas","salesVal",v=>nf(v),1],["Meta","goal",v=>nf(v),0],["Cumplimiento","goalPct",v=>pctf(v),1],["Conversión","conv",v=>pctf(v,2),1],["Llamadas realizadas","calls",v=>nf(v),0],["Llamadas contestadas","ans",v=>nf(v),0],["Ingresos","revenue",v=>money(v),1],["Calidad","quality",v=>pctf(v),1],["Adherencia","adherence",v=>pctf(v),1],["Tiempo prom. de atención","aht",v=>mmss(v),-1],["Ausencias","absences",v=>nf(v),-1]].filter(([,k])=>r[k]!=null);
  $("#modalRoot").innerHTML=`<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
   <div style="display:flex;justify-content:space-between;gap:12px;align-items:start"><div><span class="eyebrow">Ficha del operario · ${perLabel(r.period)}</span><h1 id="mt">${esc(r.agent)}</h1><p class="muted small">${r.agentId&&r.agentId!==r.agent?esc(r.agentId)+" · ":""}${esc(r.team)} · ${esc(r.sup)}</p></div><button class="btn" id="mClose">Cerrar</button></div>
   <div class="kpis" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">
    ${[["Ventas",nf(r.sales),"p"],["Cumplimiento",pctf(r.goalPct),"p"],["Conversión",pctf(r.conv,2),"p"],["Ingresos",money(r.revenue),"p"],["Calidad",pctf(r.quality),"q"],["Adherencia",pctf(r.adherence),"q"],["TMO",mmss(r.aht),"q"]].map(([l,v,g])=>`<div class="kpi group-${g}"><span class="lab">${l}</span><span class="v" style="font-size:1.15rem">${v}</span></div>`).join("")}
   </div>
   <section class="panel"><div class="panel-h"><h2>Comparación con el promedio de su equipo</h2><span class="faint small">${esc(r.team)} · ${team.length} operarios</span></div><div class="tbl-wrap"><table><thead><tr><th>Indicador</th><th class="n">Operario</th><th class="n">Promedio del equipo</th><th class="n">Diferencia</th></tr></thead><tbody>
    ${rows.map(([l,k,f,dir])=>{const a=avg(k);const d=r[k]!=null&&a!=null?r[k]-a:null;const cls=d==null||dir===0||Math.abs(d)<1e-9?"flat":d*dir>0?"good":"bad";return `<tr><td>${l}</td><td class="n">${f(r[k])}</td><td class="n">${f(a)}</td><td class="n">${d==null?"—":`<span class="delta ${cls}">${d>0?"+":"−"}${k==="aht"?mmss(Math.abs(d)):k==="revenue"?money(Math.abs(d)):["goalPct","conv","quality","adherence"].includes(k)?nf(Math.abs(d),1)+" pp":nf(Math.abs(d),1)}</span>`}</td></tr>`}).join("")}
   </tbody></table></div></section>
   <section class="panel"><div class="panel-h"><h2>Evolución histórica</h2></div><div class="panel-b">${hist.length<2?`<p class="muted small">Solo hay datos de ${perLabel(hist[0].period)}. La evolución aparecerá al importar más meses.</p>`:`<div class="legend" style="margin-bottom:6px"><span><i style="background:var(--green)"></i>Ventas</span><span><i style="background:var(--blue)"></i>Calidad %</span></div><div class="grid g2">${lineChart([{data:hist.map(h=>h.sales),color:"var(--green)"}],hist.map(h=>shortPer(h.period)))}${lineChart([{data:hist.map(h=>h.quality),color:"var(--blue)"}],hist.map(h=>shortPer(h.period)),{yMin0:false,fmt:v=>nf(v,0)})}</div>`}
    <div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Mes</th><th class="n">Ventas</th><th class="n">Cumpl.</th><th class="n">Conv.</th><th class="n">Llamadas</th><th class="n">Contest.</th><th class="n">Calidad</th><th class="n">Adher.</th><th class="n">TMO</th></tr></thead><tbody>${hist.map(h=>`<tr><td>${perLabel(h.period)}</td><td class="n">${nf(h.sales)}</td><td class="n">${pctf(h.goalPct)}</td><td class="n">${pctf(h.conv,2)}</td><td class="n">${nf(h.calls)}</td><td class="n">${nf(h.ans)}</td><td class="n">${pctf(h.quality)}</td><td class="n">${pctf(h.adherence)}</td><td class="n">${mmss(h.aht)}</td></tr>`).join("")}</tbody></table></div></div></section>
   ${r.salesVal!=null?`<p class="small muted">Estado de sus ventas en el detalle: ${nf(r.salesVal)} validadas, ${nf(r.salesPend||0)} pendientes, ${nf(r.salesAnul||0)} anuladas.</p>`:""}
  </div></div>`;
  const close=()=>$("#modalRoot").innerHTML="";$("#mClose").onclick=close;$("#mbg").onclick=e=>{if(e.target.id==="mbg")close()};$("#mClose").focus();
}

/* ============ Copiar tabla (en lugar de descarga, que el visor bloquea) ============ */
function copyTable(id){const t=document.getElementById(id);if(!t)return;
  const txt=[...t.rows].map(r=>[...r.cells].map(c=>c.innerText.replace(/[↑↓]/g,"").trim()).join("\t")).join("\n");
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Tabla copiada. Pégala en Excel con Ctrl+V")}catch(e){toast("Selecciona la tabla y cópiala manualmente")}ta.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast("Tabla copiada. Pégala en Excel con Ctrl+V"),fallback);else fallback()}

/* ============ Global ============ */
$("#themeBtn").onclick=()=>{const dark=UI.theme?UI.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;UI.theme=dark?"light":"dark";document.documentElement.setAttribute("data-theme",UI.theme);LS.set("theme",UI.theme)};
$("#menuBtn").onclick=()=>{$("#side").classList.add("open");const s=document.createElement("div");s.className="scrim";s.onclick=()=>{$("#side").classList.remove("open");s.remove()};document.body.appendChild(s)};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#modalRoot").innerHTML=""});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
render();
})();
</script>
